<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face vs Gunmen</title>
<style>
  html,body{margin:0;height:100%;background:#0e1116;color:#cfd6dd;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1rem;-webkit-user-select:none;user-select:none}
  canvas{width:100%;max-width:900px;height:auto;background:#151a21;border-radius:12px;touch-action:none}
  .pad{display:flex;gap:1rem;width:100%;max-width:900px}
  .pad button{flex:1;height:84px;font-size:1.4rem;font-weight:700;color:#eef0ec;background:#222b35;border:2px solid #3a4655;border-radius:14px;touch-action:none;-webkit-user-select:none;user-select:none}
  .pad button:active{background:#33445a}
  .pad button:focus-visible{outline:3px solid #7fcfb6}
  p{margin:0;font-size:.95rem;color:#8b96a1;text-align:center;line-height:1.5}
</style>

<body>
<canvas id="c" width="900" height="260"></canvas>
<div class="pad"><button id="bj" type="button">JUMP</button><button id="bd" type="button">DUCK (hold)</button></div>
<p>Use the JUMP and DUCK buttons, or tap the top or bottom half of the game.<br>Every 300 levels a boss farts at you (duck!), then 3 fast rockets (duck!), then gunmen. Every 1000 levels a chair boss: time your jump or duck for chairs, and double jump his lasers. Never ends.</p>

function fart(){
  try{
    unlock();if(!AC)return;
    const now=AC.currentTime,dur=0.8,n=Math.floor(dur/0.04);
    const o=AC.createOscillator(),am=AC.createGain(),env=AC.createGain(),lp=AC.createBiquadFilter();
    const lfo=AC.createOscillator(),lg=AC.createGain();
    o.type='sawtooth';
    for(let i=0;i<n;i++)o.frequency.setValueAtTime(115*(1-i/n*0.55)*(0.85+Math.random()*0.3),now+i*0.04);
    lfo.type='square';lfo.frequency.setValueAtTime(30,now);lfo.frequency.linearRampToValueAtTime(13,now+dur);
    am.gain.value=0.5;lg.gain.value=0.5;lfo.connect(lg);lg.connect(am.gain);
    lp.type='lowpass';lp.frequency.value=420;
    env.gain.setValueAtTime(0.0001,now);env.gain.exponentialRampToValueAtTime(1,now+0.05);
    env.gain.setValueAtTime(1,now+dur-0.15);env.gain.exponentialRampToValueAtTime(0.0001,now+dur);
    o.connect(am);am.connect(env);env.connect(lp);lp.connect(AC.destination);
    const nb=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=nb.getChannelData(0);

  }catch(e){}
}

function head(img,px,py,w,h,col){
  x.save();x.beginPath();x.ellipse(px+w/2,py+h/2,w/2,h/2,0,0,Math.PI*2);x.clip();
  if(img.complete&&img.naturalWidth)x.drawImage(img,px,py,w,h);else{x.fillStyle=col;x.fillRect(px,py,w,h)}
  x.restore();x.lineWidth=3;x.strokeStyle=col;
  x.beginPath();x.ellipse(px+w/2,py+h/2,w/2-1,h/2-1,0,0,Math.PI*2);x.stroke();
}
function drawHuman(o){
  const rows=HUMANS[o.type],top=GROUND-HH;
  for(let r=0;r<rows.length;r++)for(let k=0;k<rows[r].length;k++){
    const ch=rows[r][k];if(ch==='.')continue;
    x.fillStyle=ch==='g'?'#b0bec5':r<4?'#e8b98a':r<11?'#c0392b':'#34495e';
    x.fillRect(o.x+k*PX,top+r*PX,PX,PX);

}

  for(const o of obs)if(dx2>o.x+6&&dx1<o.x+HW-4&&dy2>GROUND-HH)hit=true;
  for(const b of bullets)if(dx2>b.x&&dx1<b.x+14&&dy2>b.y-3&&dy1<b.y+3)hit=true;
  for(const b of beams){if(b.wall){if(dx2>b.h&&dx1<b.t&&dy2>GROUND-170)hit=true}else if(dx2>b.h&&dx1<b.t&&dy2>BY-10&&dy1<BY+10)hit=true}
  for(const ch of chairs){const hh=75*Math.abs(Math.sin(ch.ph));if(dx2>ch.x&&dx1<ch.x+32&&dy2>GROUND-hh-34&&dy1<GROUND-hh)hit=true}
  for(const r of rockets)if(dx2>r.x&&dx1<r.x+80&&dy2>GROUND-130&&dy1<GROUND-24)hit=true;
  if(hit){over=true;if(L>hi){hi=L;try{localStorage.setItem('dinoHi',hi)}catch(e){}}}
}
function draw(){
  x.clearRect(0,0,W,c.height);
  {const Lb=lvl();if(Lb>=1000&&Lb%1000<300){x.fillStyle=`hsl(${(t*0.2)%360},90%,45%)`;x.fillRect(0,0,W,c.height)}}
  x.fillStyle='#3a434d';x.fillRect(0,GROUND,W,2);
  obs.forEach(drawHuman);
  x.fillStyle='#ffd54a';
  for(const b of bullets){x.fillRect(b.x,b.y-3,14,6);x.fillStyle='#ff8a3d';x.fillRect(b.x+10,b.y-3,4,6);x.fillStyle='#ffd54a'}
  if(boss){
    const p=Math.min(1,boss.t/30),q=p-1;let sc=1+2.70158*q*q*q+1.70158*q*q;
    x.save();
    if(boss.out){x.globalAlpha=Math.max(0,1-boss.out/30);sc*=Math.max(0.3,1-boss.out/50)}
    x.translate(BX+BW/2,GROUND);x.scale(sc,sc);
    head(boss.kind==='chair'?BOSS2IMG:BOSSIMG,-BW/2,-BH,BW,BH,boss.kind==='chair'?(boss.warn?'#ff3b7a':'#ff9a3c'):(boss.ch>0?'#9bd13a':'#b388ff'));
    x.restore();
    if(boss.ch>0){
      x.strokeStyle='rgba(150,210,60,'+(0.3+0.25*Math.sin(t*0.03))+')';x.lineWidth=3;x.setLineDash([12,10]);
      x.beginPath();x.moveTo(BX,BY);x.lineTo(0,BY);x.stroke();x.setLineDash([]);
    }
    if(boss.fl>0&&boss.kind==='fart'){x.fillStyle='#b6e04a';x.font='bold 24px system-ui';x.textAlign='center';x.fillText('PFFFT!',BX-10,BY-24)}
  }
  for(const b of beams){
    if(!b.wall)continue;
    const wd=Math.max(1,b.t-b.h),g=x.createLinearGradient(0,GROUND-170,0,GROUND);
    g.addColorStop(0,'rgba(255,40,120,0.25)');g.addColorStop(1,'rgba(255,40,120,0.75)');
    x.fillStyle=g;x.fillRect(b.h,GROUND-170,wd,170);
    x.fillStyle='rgba(255,230,240,0.95)';x.fillRect(b.h,GROUND-170,4,170);x.fillRect(b.h,GROUND-172,wd,3);
    for(let px=b.h;px+50<=b.t+4;px+=52)for(let j=0;j<3;j++)head(BOSSIMG,px,GROUND-170+j*57,50,57,'#ff3b7a');
  }
  for(const ch of chairs){
    const hh=75*Math.abs(Math.sin(ch.ph)),bx=ch.x,by=GROUND-hh;
    x.fillStyle='rgba(0,0,0,0.25)';x.fillRect(bx+2,GROUND-3,28,3);
    x.fillStyle='#7a4a22';x.fillRect(bx+2,by-12,5,12);x.fillRect(bx+23,by-12,5,12);
    x.fillStyle='#a8693a';x.fillRect(bx,by-18,30,6);x.fillRect(bx+24,by-34,6,22);
  }
  if(boss&&boss.warn){
    x.strokeStyle='rgba(255,60,130,'+(0.35+0.3*Math.sin(t*0.03))+')';x.lineWidth=3;x.setLineDash([12,10]);
    x.beginPath();x.moveTo(BX,GROUND-170);x.lineTo(0,GROUND-170);x.stroke();x.setLineDash([]);
    x.fillStyle='#ff5a9a';x.font='bold 28px system-ui';x.textAlign='center';x.fillText('LASER! DOUBLE JUMP!',W/2,100);x.font='24px system-ui';
  }
  for(const b of beams){
    if(b.wall)continue;
    const span=Math.max(1,b.t-b.h);
    for(let px=Math.max(b.h,-20);px<b.t;px+=9){
      const f=(px-b.h)/span;
      const r=8+6*(1-f)+2*Math.sin(px*0.09+t*0.015);
      const yy=BY+4*Math.sin(px*0.05+t*0.012)+3*Math.sin(px*0.13-t*0.02);
      const a=0.18+0.42*f;
      const g=x.createRadialGradient(px,yy,0,px,yy,r);
      g.addColorStop(0,'rgba(205,218,85,'+a+')');
      g.addColorStop(0.55,'rgba(130,165,45,'+a*0.7+')');
      g.addColorStop(1,'rgba(110,150,40,0)');
      x.fillStyle=g;x.beginPath();x.arc(px,yy,r,0,6.283);x.fill();
    }
    x.fillStyle='rgba(170,200,70,0.15)';
    for(let px=Math.max(b.h,-20);px<b.t;px+=45){
      x.beginPath();x.arc(px,BY-17-6*Math.sin(px*0.04+t*0.01),5,0,6.283);x.fill();
    }
  }
  if(phase==='rocket'&&rk&&rk.state==='tele'){
    x.strokeStyle='rgba(255,70,50,'+(0.3+0.3*Math.sin(t*0.03))+')';x.lineWidth=3;x.setLineDash([12,10]);
    x.beginPath();x.moveTo(W,RY);x.lineTo(0,RY);x.stroke();x.setLineDash([]);
    x.fillStyle='#ff4b3a';x.font='bold 34px system-ui';x.textAlign='center';x.fillText('!',W-24,RY+12);
  }
  for(const r of rockets){
    x.fillStyle='rgba(255,140,40,0.10)';x.fillRect(r.x,GROUND-130,80,106);
    const fl=60+Math.random()*25,g=x.createLinearGradient(r.x+60,0,r.x+60+fl,0);
    g.addColorStop(0,'rgba(255,205,60,0.95)');g.addColorStop(0.5,'rgba(255,100,30,0.7)');g.addColorStop(1,'rgba(255,60,20,0)');
    x.fillStyle=g;x.fillRect(r.x+60,RY-8,fl,16);
    x.fillStyle='#cfd6dd';x.fillRect(r.x+14,RY-11,46,22);
    x.fillStyle='#d9423a';x.beginPath();x.moveTo(r.x,RY);x.lineTo(r.x+14,RY-11);x.lineTo(r.x+14,RY+11);x.closePath();x.fill();
    x.fillRect(r.x+30,RY-11,6,22);
    x.fillStyle='#8b96a1';x.fillRect(r.x+46,RY-18,14,7);x.fillRect(r.x+46,RY+11,14,7);
  }
  const col=`hsl(${(t*0.12)%360},100%,58%)`;
  if(input.duck&&dino.on){
    x.save();x.translate(dino.x,dino.y);x.scale(1.25,0.45);head(FACE,0,-DH,DW,DH,col);x.restore();
  }else{
    const bob=dino.on&&started&&!over?Math.abs(Math.sin(frame*0.35))*3:0;
    head(FACE,dino.x,dino.y-DH-bob,DW,DH,col);
  }
  const L=lvl();
  x.fillStyle='#8b96a1';x.font='20px monospace';x.textAlign='right';
  x.fillText('BEST '+hi+'   LEVEL '+L,W-20,35);
  x.textAlign='center';x.font='24px system-ui';x.fillStyle='#cfd6dd';
  const msg={pre:'BOSS INCOMING...',rest1:'BOSS DEFEATED! ROCKETS NEXT',rest2:'GUNMEN ARE BACK',rest3:'BOSS DEFEATED! GET READY...'}[phase];
  if(msg&&!over&&started){x.fillStyle='#cfd6dd';x.fillText(msg,W/2,100)}
  if(phase==='rocket'&&rk&&rk.n===0&&rk.state==='tele'&&!over){x.fillStyle='#ff6b5a';x.font='bold 28px system-ui';x.fillText('ROCKETS! DUCK!',W/2,100);x.font='24px system-ui';x.fillStyle='#cfd6dd'}
  if(!started)x.fillText('Tap to start',W/2,100);
  if(over)x.fillText('Game over at level '+L+'. Tap to play again',W/2,100);
  if(boss&&!boss.out&&!over&&boss.t<120&&Math.floor(boss.t/10)%2===0){x.fillStyle='#b6e04a';x.font='bold 30px system-ui';x.fillText(boss.kind==='chair'?'CHAIR BOSS!':'BOSS!',W/2,100)}
}
function loop(ts){
  const dt=Math.min(ts-last,50);last=ts;t=ts;
  update(dt/16.67);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
