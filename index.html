let hi=0;try{hi=+localStorage.getItem('dinoHi')||0}catch(e){}
let dino,obs,bullets,beams,parts,speed,score,over,started,frame,next,boss,win,winT,fwT,last=0,t=0;
const input={duck:false};
const lvl=()=>Math.min(150,1+Math.floor(frame*149/1020));
function reset(){
  const q=Math.max(1,+new URLSearchParams(location.search).get('lv')||1);
  dino={x:DX,y:GROUND,vy:0,on:true,jumps:0};
  obs=[];bullets=[];beams=[];parts=[];speed=Math.min(12,6+q*0.07);
  over=false;frame=(q-1)*1020/149;next=80;boss=null;win=false;winT=0;fwT=0;
}
reset();started=false;
function jump(){
  if(win){if(winT>90){reset();started=true}return}
  if(over){reset();started=true;return}
  started=true;
  if(dino.on){dino.vy=-14.5;dino.on=false;dino.jumps=1}
  else if(boss&&dino.jumps<2){dino.vy=-14.5;dino.jumps=2}
}
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}
  if(e.code==='ArrowDown'){e.preventDefault();input.duck=true}
});
addEventListener('keyup',e=>{if(e.code==='ArrowDown')input.duck=false});
c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect();
  if(!started||over||win||(e.clientY-r.top)/r.height<=0.5)jump();else input.duck=true;
});
document.getElementById('bj').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.getElementById('bd').addEventListener('pointerdown',e=>{e.preventDefault();if(started&&!over&&!win)input.duck=true});
addEventListener('pointerup',()=>{input.duck=false});
addEventListener('pointercancel',()=>{input.duck=false});

function head(img,px,py,w,h,col){
  x.save();x.beginPath();x.ellipse(px+w/2,py+h/2,w/2,h/2,0,0,Math.PI*2);x.clip();
  if(img.complete&&img.naturalWidth)x.drawImage(img,px,py,w,h);else{x.fillStyle=col;x.fillRect(px,py,w,h)}
  x.restore();x.lineWidth=3;x.strokeStyle=col;
  x.beginPath();x.ellipse(px+w/2,py+h/2,w/2-1,h/2-1,0,0,Math.PI*2);x.stroke();
}
function drawHuman(o){
  const rows=HUMANS[o.type],top=GROUND-HH;
  for(let r=0;r<rows.length;r++)for(let k=0;k<rows[r].length;k++){
    const ch=rows[r][k];if(ch==='.')continue;
    x.fillStyle=ch==='g'?'#b0bec5':r<4?'#e8b98a':r<11?'#c0392b':'#34495e';
    x.fillRect(o.x+k*PX,top+r*PX,PX,PX);
  }
  if(o.flash>0){x.fillStyle='#ffd54a';x.fillRect(o.x-10,top+GUN_ROWS[o.type]*PX-3,9,9)}
}
function burst(cx,cy,n,hue){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1.5+Math.random()*4.5;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60+Math.random()*30,h:hue+Math.random()*40})}
}
function startWin(){win=true;winT=0;fwT=0;obs=[];bullets=[];beams=[];dino.vy=0;
  if(150>hi){hi=150;try{localStorage.setItem('dinoHi',hi)}catch(e){}}}
function updateWin(s){
  winT+=s;fwT-=s;
  dino.x+=(W/2-DW/2-dino.x)*0.08*s;
  dino.y=GROUND-Math.abs(Math.sin(winT*0.1))*85;dino.on=false;
  if(boss&&winT<90&&Math.random()<0.6*s)burst(BX+BW/2+(Math.random()-.5)*60,GROUND-BH/2+(Math.random()-.5)*60,12,Math.random()*360);
  if(winT>100)boss=null;
  if(fwT<=0){burst(W/2+(Math.random()*2-1)*360,40+Math.random()*130,40,Math.random()*360);fwT=22}
}
function update(s){
  for(const p of parts){p.x+=p.vx*s;p.y+=p.vy*s;p.vy+=0.07*s;p.l-=s}
  parts=parts.filter(p=>p.l>0);
  if(win){updateWin(s);return}
  if(!started||over)return;
  frame+=s;speed=Math.min(12,6+lvl()*0.07);
  const L=lvl();
  if(L>=150){startWin();return}
  const duck=input.duck&&dino.on;
  dino.vy+=0.75*s*((input.duck&&!dino.on)?2.2:1);dino.y+=dino.vy*s;
  if(dino.y>=GROUND){dino.y=GROUND;dino.vy=0;dino.on=true;dino.jumps=0}
  if(frame>=600&&!boss)boss={t:0,cd:60,ch:0};
  if(boss){
    boss.t+=s;
    const p=Math.min(1,(frame-600)/420),vB=14+6*p;
    if(boss.ch>0){boss.ch-=s;if(boss.ch<=0)beams.push({h:BX+6,t:BX+6,v:vB,len:40*vB})}
    else if(boss.t>45){boss.cd-=s;if(boss.cd<=0){boss.ch=35;boss.cd=160-60*p}}
  }
  for(const b of beams){b.h-=b.v*s;b.t=Math.min(BX+6,b.h+b.len)}
  beams=beams.filter(b=>b.t>-10);
  next-=speed*s;
  if(next<=0){
    const type=Math.random()<0.5?0:1,first=W-120-Math.random()*220,fire=[];
    if(!boss)fire.push(first);
    obs.push({x:W+20,type,fire,flash:0});
    next=(boss?700:520)+Math.random()*350+speed*25;
  }
  for(const o of obs){
    o.x-=speed*s;if(o.flash>0)o.flash-=s;
    while(o.fire.length&&o.x<o.fire[0]){
      o.fire.shift();bullets.push({x:o.x-12,y:GROUND-HH+GUN_ROWS[o.type]*PX+3});o.flash=6;
    }
  }
  for(const b of bullets)b.x-=(speed+5)*s;
  obs=obs.filter(o=>o.x+HW+10>0);bullets=bullets.filter(b=>b.x>-30);
  const dx1=DX+6,dx2=DX+(duck?DW*1.25:DW)-6;
  const dy1=dino.y-(duck?DH*0.45-4:DH-6),dy2=dino.y;
  let hit=false;
  for(const o of obs)if(dx2>o.x+6&&dx1<o.x+HW-4&&dy2>GROUND-HH)hit=true;
  for(const b of bullets)if(dx2>b.x&&dx1<b.x+14&&dy2>b.y-3&&dy1<b.y+3)hit=true;
  for(const b of beams)if(dx2>b.h&&dx1<b.t&&dy2>BY-6&&dy1<BY+6)hit=true;
  if(hit){over=true;if(L>hi){hi=L;try{localStorage.setItem('dinoHi',hi)}catch(e){}}}
}
function draw(){
  x.clearRect(0,0,W,c.height);
  x.fillStyle='#3a434d';x.fillRect(0,GROUND,W,2);
  obs.forEach(drawHuman);
  x.fillStyle='#ffd54a';
  for(const b of bullets){x.fillRect(b.x,b.y-3,14,6);x.fillStyle='#ff8a3d';x.fillRect(b.x+10,b.y-3,4,6);x.fillStyle='#ffd54a'}
  if(boss){
    const p=Math.min(1,boss.t/30),q=p-1,sc=1+2.70158*q*q*q+1.70158*q*q;
    x.save();
    x.globalAlpha=win?Math.max(0,1-winT/100):1;
    x.translate(BX+BW/2+(win?(Math.random()-.5)*8:0),GROUND);x.scale(sc,sc);
    head(BOSSIMG,-BW/2,-BH,BW,BH,boss.ch>0?'#ff3b3b':'#b388ff');
    x.restore();
    if(boss.ch>0){
      x.strokeStyle='rgba(255,60,60,'+(0.3+0.25*Math.sin(t*0.03))+')';x.lineWidth=3;x.setLineDash([12,10]);
      x.beginPath();x.moveTo(BX,BY);x.lineTo(0,BY);x.stroke();x.setLineDash([]);
    }
  }
  for(const b of beams){x.fillStyle='#ff3b3b';x.fillRect(b.h,BY-6,b.t-b.h,12);x.fillStyle='#ffe0e0';x.fillRect(b.h,BY-2,b.t-b.h,4)}
  const col=`hsl(${(t*0.12)%360},100%,58%)`;
  if(input.duck&&dino.on&&!win){
    x.save();x.translate(dino.x,dino.y);x.scale(1.25,0.45);head(FACE,0,-DH,DW,DH,col);x.restore();
  }else{
    const bob=dino.on&&started&&!over?Math.abs(Math.sin(frame*0.35))*3:0;
    head(FACE,dino.x,dino.y-DH-bob,DW,DH,col);
  }
  x.globalCompositeOperation='lighter';
  for(const p of parts){x.globalAlpha=Math.min(1,p.l/40);x.fillStyle=`hsl(${p.h},100%,60%)`;x.fillRect(p.x,p.y,3,3)}
  x.globalCompositeOperation='source-over';x.globalAlpha=1;
  const L=lvl();
  x.fillStyle='#8b96a1';x.font='20px monospace';x.textAlign='right';
  x.fillText('BEST '+hi+'   LEVEL '+L,W-20,35);
  x.textAlign='center';x.font='24px system-ui';x.fillStyle='#cfd6dd';
  if(!started)x.fillText('Tap to start',W/2,100);
  if(over)x.fillText('Game over at level '+L+'. Tap to play again',W/2,100);
  if(boss&&!win&&!over&&boss.t<120&&Math.floor(boss.t/10)%2===0){x.fillStyle='#ff5a5a';x.font='bold 30px system-ui';x.fillText('FINAL BOSS',W/2,100)}
  if(win){x.fillStyle='#ffd54a';x.font='bold 34px system-ui';x.fillText('YOU WIN!',W/2,60);
    if(winT>90){x.fillStyle='#cfd6dd';x.font='20px system-ui';x.fillText('Tap to play again',W/2,90)}}
}
function loop(ts){
  const dt=Math.min(ts-last,50);last=ts;t=ts;
  update(dt/16.67);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
