<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALSAWAD</title>
<meta name="description" content="The personal website of ALSAWAD.">
<style>
  :root { --bg:#f7f5f0; --ink:#1c2321; --muted:#5d6763; --accent:#1f5c4d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151a18; --ink:#eef0ec; --muted:#a2aca7; --accent:#7fcfb6; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height:1.65; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:2rem 1.5rem;
  }
  main { max-width:34rem; width:100%; }
  h1 { font-size:clamp(2.8rem,12vw,5rem); line-height:1.05; letter-spacing:-0.02em; margin:0 0 1.25rem; }
  p { font-size:1.15rem; margin:0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ALSAWAD</h1>
  <p>Welcome to my website.</p>
</main>
</body>
</html>
